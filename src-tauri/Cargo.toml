[package]
name = "manifest"
version = "1.1.2"
description = "An instant grid-based pinboard for note taking."
authors = ["Stephen McGurrin"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "manifest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-fs = "2"
serde_json = "1"
tauri-plugin-dialog = "2.0.0-rc.8"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
